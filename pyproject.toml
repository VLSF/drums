[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drums"
version = "0.1.0"
description = "Tutorial on inverse problems: restoring the shape of a 2D drum from its spectrum"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "jax", "triangle"]

[tool.setuptools.packages.find]
where = ["src"]
